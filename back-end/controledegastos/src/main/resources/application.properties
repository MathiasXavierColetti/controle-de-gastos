# ===================================================================
# CONFIGURAÇÕES DA APLICAÇÃO
# ===================================================================
spring.application.name=controledegastos
server.port=8090

# ===================================================================
# CONEXÃO COM BANCO DE DADOS (Supabase PostgreSQL - Transaction Pooler)
# ===================================================================
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.npvpjzzsggnoqzwjozsu
spring.datasource.password=MathiasColetti2004
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURAÇÕES DO POOL DE CONEXÕES (HikariCP)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# CONFIGURAÇÕES JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURAÇÕES DO JWT E SWAGGER
# ===================================================================
jwt.secret=9a2f8c4e7b1a5d3f8e6c4b2a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e
jwt.expiration=86400000

# Personaliza o caminho do Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Personaliza o caminho da especificação OpenAPI em JSON
springdoc.api-docs.path=/v3/api-docs